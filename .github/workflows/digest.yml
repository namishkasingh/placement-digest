name: Weekly Placement Digest

on:
  schedule:
    # Runs every Monday at 8:00 AM IST (2:30 AM UTC)
    - cron: "30 2 * * 1"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated database
        run: |
          git config --global user.name "digest-bot"
          git config --global user.email "actions@github.com"
          git add jobs.db
          git commit -m "Update jobs database [automated]" || echo "No changes to commit"
          git push
